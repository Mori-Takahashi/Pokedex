<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the world of Pokémon with Mori's interactive Pokedex. Search, discover, and learn about your favorite Pokémon using the PokeAPI.">
    <meta name="keywords" content="Pokemon, Pokedex, API, JavaScript, Bootstrap, Web App">
    <meta name="author" content="Mori Takahashi">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lyonel-berzen.developerakademie.net/pokedex/index.html">
    <meta property="og:title" content="Mori's Pokédex - Interactive Pokémon Explorer">
    <meta property="og:description" content="Explore the world of Pokémon with Mori's interactive Pokedex. Search, discover, and learn about your favorite Pokémon using the PokeAPI.">
    <meta property="og:image" content="./icons/hero.webp">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://lyonel-berzen.developerakademie.net/pokedex/index.html">
    <meta property="twitter:title" content="Mori's Pokédex - Interactive Pokémon Explorer">
    <meta property="twitter:description" content="Explore the world of Pokémon with Mori's interactive Pokedex. Search, discover, and learn about your favorite Pokémon using the PokeAPI.">
    <meta property="twitter:image" content="./icons/hero.webp">
    <title>Mori's Pokédex - Interactive Pokémon Explorer</title>
    <link rel="shortcut icon" href="./icons/ball.webp" type="image/x-icon">
    <link rel="stylesheet" href="./style/index.css" />
    <script src="./scripts/script.js"></script>
    <script src="./templates/poke-render.js"></script>
    <script src="./templates/poke-render-search.js"></script>
    <script src="./templates/big-poke-view.js"></script>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="welcomeMessage" class="welcome-message" role="dialog" aria-labelledby="welcomeTitle" aria-modal="true">
      <h1 id="welcomeTitle" class="d-non">Welcome to Mori's Pokédex!</h1>
      <p class="mb-3">Discover the amazing world of Pokémon</p>
      <button class="btn btn-primary" onclick="hideWelcomeMessage()" aria-label="Start exploring Pokémon">Start Exploring</button>
    </div>

    <nav class="navbar navbar-dark bg-dark fixed-top" role="navigation" aria-label="Main navigation">
      <div class="container-fluid justify-content-around">
        <a class="pokefont navbar-brand no-copy" href="#" aria-label="Mori's Pokédex Home">
          <svg width="30" height="30" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="100" cy="100" r="90" stroke="black" stroke-width="5" fill="white"/>
            <path d="M 10 100 A 90 90 0 0 1 190 100" fill="red" stroke="black" stroke-width="5"/>
            <path d="M 10 100 A 90 90 0 0 0 190 100" fill="white" stroke="black" stroke-width="5"/>
            <circle cx="100" cy="100" r="25" stroke="black" stroke-width="5" fill="white"/>
            <circle cx="100" cy="100" r="10" stroke="black" stroke-width="5" fill="white"/>
            <line x1="10" y1="100" x2="190" y2="100" stroke="black" stroke-width="5"/>
          </svg> 
          Mori's Pokédex
        </a>
        <form class="d-flex form-inline" role="search" onsubmit="searchPokemon(); return false;" aria-label="Search Pokémon">
          <div class="position-relative">
            <input 
              class="form-control me-2" 
              id="searchPokemonValue" 
              type="search" 
              placeholder="Search Pokémon..." 
              aria-label="Search for Pokémon by name" 
              oninput="showSuggestions()"
              autocomplete="off"
              spellcheck="false"
            >
            <div id="suggestions" class="dropdown-menu position-absolute" style="top: 100%; left: 0; right: 0;"></div>
          </div>
          <button class="btn btn-outline-success" type="submit" aria-label="Submit search">Search</button>
        </form>
      </div>
    </nav>

    <div id="alertMessage" class="d-non alert alert-warning" role="alert" aria-live="polite">
      
    </div>
    <div id="liveAlertPlaceholder" aria-live="polite"></div>

    <section id="renderInfos" class="d-non big-view-pokemon" role="dialog" aria-modal="true" aria-labelledby="pokemonDetailTitle">
      <!-- Pokémon details will be rendered here -->
    </section>
    
    <main class="flex-grow-1" role="main">
      <section aria-label="Pokémon gallery">
        <div class="container text-center">
          <div class="row d-flex justify-content-center row-cols-4" id="render" role="grid" aria-label="Pokémon cards">
            <!-- Pokémon cards will be rendered here -->
          </div>
          <div id="spinner" class="container-spinner" aria-label="Loading Pokémon data" role="status">
            <svg viewBox="0 0 40 40" height="40" width="40" aria-hidden="true">
              <circle class="track" cx="20" cy="20" r="17.5" pathlength="100" stroke-width="5px" fill="none"/>
              <circle class="car" cx="20" cy="20" r="17.5" pathlength="100" stroke-width="5px" fill="none"/>
            </svg>
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </section>

      <nav class="margin-bottom-10 gap-2 d-flex justify-content-center" aria-label="Pagination navigation">
        <button 
          class="max-width-button btn btn-dark" 
          id="previousPage" 
          onclick="previousPage()" 
          type="button" 
          disabled
          aria-label="Go to previous page"
        >
          &#8617; Previous
        </button>
        <a 
          class="max-width-button btn btn-dark link-light text-decoration-none d-flex align-items-center justify-content-center" 
          href="." 
          aria-label="Go to home page"
        >
          &#127968; Home
        </a>
        <button 
          class="max-width-button btn btn-dark" 
          id="nextPage" 
          onclick="nextPage()" 
          type="button" 
          disabled
          aria-label="Go to next page"
        >
          Next &#8618;
        </button>
      </nav>
    </main>

    <footer id="sticky-footer" class="py-4 bg-dark text-white-50" role="contentinfo">
      <div class="container text-center">
        <small>
          &copy; 2024 Mori's Pokédex. All rights reserved. | 
          Created by Mori Takahashi | 
          <a 
            class="link-light link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" 
            href="https://github.com/Mori-Takahashi"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Mori Takahashi's GitHub profile"
          >
            <img class="git-img" src="./icons/github-mark-white.png" alt="GitHub logo">
            GitHub
          </a> | 
          <a 
            class="link-light link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" 
            href="./info.html"
            aria-label="View information and legal notice"
          >
            Info & Impressum
          </a>
        </small>
      </div>
    </footer>

    <canvas id="animationCanvas" aria-hidden="true"></canvas>
  </body>
</html>
